[package]
name = "r-ya-mapping"
version = "0.1.0"
edition = "2024"
description = "Beat Saber quick-start mapping helper: download, detect BPM, scaffold a map."
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
dirs = "5"
rustfft = "6.2"

[profile.release]
opt-level = 3
lto = "thin"